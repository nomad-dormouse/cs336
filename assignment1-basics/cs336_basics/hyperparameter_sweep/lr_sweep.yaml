program: cs336_basics/train_transformer.py
method: grid
name: cs336-assignment1-lr-sweep
metric:
  name: val_loss
  goal: minimize
parameters:
  learning_rate:
    values: [3e-4, 1e-3, 3e-3, 1e-2, 3e-2, 1e-1]
  batch_size:
    value: 32
  context_length:
    value: 256
  d_model:
    value: 512
  num_heads:
    value: 16
  d_ff:
    value: 1344
  num_layers:
    value: 4
  weight_decay:
    value: 0.1
  warmup_iters:
    value: 20
  max_iters:
    value: 500
  cosine_cycle_iters:
    value: 500
  val_batch_size:
    value: 256
  grad_clip:
    value: 1.0
  device:
    value: auto