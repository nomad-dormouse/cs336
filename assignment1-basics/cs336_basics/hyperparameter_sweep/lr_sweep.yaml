# 7 Experiments

# Problem (learning_rate): Tune the learning rate (3 points) (4 H100 hrs)

program: cs336_basics/train_transformer.py
method: grid
name: cs336-assignment1-lr-sweep
metric:
  name: val_loss
  goal: minimize
parameters:
  # Learning rate sweep
  learning_rate:
    values: [3e-4, 1e-3, 3e-3, 1e-2, 3e-2, 1e-1]
  
  # Required arguments
  test_mode:
    value: 0
  device:
    value: auto
  dataset:
    value: TS
  
  # Model architecture
  vocab_size:
    value: 10000
  context_length:
    value: 256
  d_model:
    value: 512
  d_ff:
    value: 1344
  num_layers:
    value: 4
  num_heads:
    value: 16
  
  # Training hyperparameters
  batch_size:
    value: 32
  val_batch_size:
    value: 256
  max_iters:
    value: 500
  warmup_iters:
    value: 20
  cosine_cycle_iters:
    value: 500
  grad_clip:
    value: 1.0
  weight_decay:
    value: 0.1
  
  # Logging
  eval_and_log_interval:
    value: 50
  checkpoint_interval:
    value: 200
  no_wandb:
    value: false  wandb_project:
    value: cs336-assignment1-lr-sweep
